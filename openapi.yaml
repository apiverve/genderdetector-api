openapi: 3.0.4
info:
  title: Gender Detector
  description: >-
    Gender Detector is a gender prediction API that estimates the likely gender
    of a person from their name. Pass a first name and get back the predicted
    gender as JSON, ready for salutations, profile defaults, or audience
    analysis.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/genderdetector:
    get:
      summary: Gender Detector
      description: Detect the likely gender based on a given name
      operationId: genderdetector
      parameters:
        - name: name
          in: query
          schema:
            type: string
          required: true
          description: The name for which you want to detect the gender
          example: John Mcdonald
        - name: country
          in: query
          schema:
            type: string
          required: false
          description: >-
            The country code for the name (e.g., US). Recorded and echoed back
            in the response, but detection does not yet vary by country - the
            same name returns the same gender whichever code you pass
          example: US
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  name: John Mcdonald
                  country: US
                  detected: true
                  gender: male
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
