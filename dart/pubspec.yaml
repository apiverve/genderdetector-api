name: apiverve_genderdetector
description: "Gender Detector is a gender prediction API that estimates the likely gender of a person from their name. Pass a first name and get back the predicted gender as JSON, ready for salutations, profile defaults, or audience analysis."
version: 1.2.4
homepage: https://apiverve.com/marketplace/genderdetector?utm_source=dart&utm_medium=referral&utm_content=homepage
repository: https://github.com/apiverve/genderdetector-api/tree/main/dart

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  http: ^1.1.0
  http_parser: ^4.0.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
